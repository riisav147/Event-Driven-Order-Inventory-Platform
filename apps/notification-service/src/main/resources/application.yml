server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/notification}
    username: ${DB_USERNAME:notification}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 1000
        delivery.timeout.ms: 10000
        request.timeout.ms: 3000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
      ack-mode: record
service:
  password: ${NOTIFICATION_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 1s
      export:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      probes:
        enabled: true
platform:
  telemetry:
    role: notification
    database-enabled: ${TELEMETRY_DATABASE_ENABLED:true}
    metrics-token: ${METRICS_TOKEN:local-metrics-only}
    kafka-lag-enabled: ${TELEMETRY_KAFKA_LAG_ENABLED:true}
  messaging:
    enabled: ${KAFKA_ENABLED:true}
    relay-enabled: true
    order-topic: platform.orders.v1
    notification-group: platform.notifications.v1

logging:
  structured:
    format:
      console: ${PLATFORM_LOG_FORMAT:}
