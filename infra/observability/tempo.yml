# Tempo 3 monolithic local development; no additional ingest Kafka dependency.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
live_store:
  max_trace_idle: 10s
  max_block_duration: 5m
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 24h
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
usage_report:
  reporting_enabled: false
