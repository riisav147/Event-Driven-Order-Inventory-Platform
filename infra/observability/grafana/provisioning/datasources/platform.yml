apiVersion: 1
datasources:
  - name: Platform Prometheus
    uid: platform-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: platform-tempo
  - name: Platform Traces
    uid: platform-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
