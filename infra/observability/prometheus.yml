global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: platform
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials: local-metrics-only
    static_configs:
      - targets: ["core-platform:8080", "inventory-service:8082", "notification-service:8083"]
